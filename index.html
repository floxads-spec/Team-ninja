<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');

html,body{

  background:#050510!important;

}

#ninja-page,
#ninja-page *,
#ninja-page *::before,
#ninja-page *::after{

#ninja-page{
  position:relative;
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100vw;
  max-width:none!important;
  min-height:100vh;
  min-height:100svh;
  margin:0 calc(50% - 50vw)!important;
  padding:40px 16px;
  overflow:hidden;
  color:#fff;
  font-family:'Poppins',sans-serif;
  background:

    radial-gradient(circle at 90% 85%,rgba(255,67,162,.23),transparent 40%),
    linear-gradient(145deg,#050510,#11091e 55%,#080f20);
}

#ninja-page .nj-glow{
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  filter:blur(75px);
  opacity:.35;
  pointer-events:none;
  animation:nj-drift 9s ease-in-out infinite alternate;
}
#ninja-page .nj-glow-one{
  top:-130px;
  right:-130px;
  background:#a44cff;
}
#ninja-page .nj-glow-two{
  bottom:-130px;
  left:-130px;
  background:#ff43a2;
  animation-delay:-4s;
}

#ninja-page .nj-grid{
  position:absolute;
  inset:0;
  opacity:.07;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);
  background-size:42px 42px;
  animation:nj-grid-move 14s linear infinite;
}

#ninja-page .nj-card{

  max-width:390px;

  border-radius:28px;
  background:rgba(8,7,18,.9);
  text-align:center;
  box-shadow:

    inset 0 1px 0 rgba(255,255,255,.06);
  animation:nj-entry .8s ease-out;
}

#ninja-page .nj-logo{
  position:relative;
  width:122px;
  height:122px;
  margin:0 auto 26px;

  animation:nj-float 3.5s ease-in-out infinite;
}
#ninja-page .nj-logo::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:conic-gradient(

  animation:nj-spin 5s linear infinite;
}
#ninja-page .nj-logo::after{
  content:"";
  position:absolute;

  line-height:1.5;
  letter-spacing:1.3px;

}

  cursor:pointer;
  transition:transform .3s ease,box-shadow .3s ease;
}
#ninja-page .nj-button::before{

  left:-120%;

}

  outline-offset:5px;
}
#ninja-page .nj-button:active{transform:scale(.97)}

  display:flex;
  align-items:center;
  gap:10px;
  margin:20px 0 0;
  padding:11px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  background:rgba(255,255,255,.03);
  color:rgba(255,255,255,.58);
  font-size:9.5px;
  line-height:1.6;
  text-align:left;
}
#ninja-page .nj-age{
  display:flex;
  align-items:center;

  flex:0 0 34px;

  font-weight:800;

@keyframes nj-drift{
  to{transform:translate(40px,35px) scale(1.15)}
}
@keyframes nj-grid-move{
  to{background-position:0 84px}
}
@keyframes nj-entry{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes nj-float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}
@keyframes nj-spin{
  to{transform:rotate(360deg)}
}
@keyframes nj-pulse{
  from{transform:scale(.95);opacity:.8}
  to{transform:scale(1.18);opacity:0}
}
@keyframes nj-shine{
  0%,35%{left:-120%}
  70%,100%{left:150%}
}

@media(hover:hover){
  #ninja-page .nj-button:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 45px rgba(164,76,255,.42);

}
@media(max-width:350px){
  #ninja-page{padding:28px 10px}
  #ninja-page .nj-card{padding:30px 14px 22px}
  #ninja-page .nj-heading{font-size:28px}
  #ninja-page .nj-button{font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){

  #ninja-page *::before,
  #ninja-page *::after{
    animation:none!important;
    transition:none!important;
  }
}
